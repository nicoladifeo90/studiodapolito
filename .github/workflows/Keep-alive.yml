name: Keep Supabase Alive

on:
  schedule:
    # Esegue lo script ogni 3 giorni a mezzanotte
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permette l'avvio manuale per testarlo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/gestionale_data?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
